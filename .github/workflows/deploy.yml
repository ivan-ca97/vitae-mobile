name: deploy

# Disparo por tags:
#   git tag v1.2.3        -> publica un OTA update (cambios JS/UI, llega en segundos)
#   git tag build-v1.2.3  -> ademas compila APK y lo adjunta a un GitHub Release
#                            (usar cuando cambias codigo nativo: plugins, permisos, SDK)
on:
  push:
    tags:
      - "v*"
      - "build-v*"

# URL publica del backend (Tailscale Funnel). El runner no tiene .env.local,
# asi que se inyecta aqui para que el bundle OTA apunte al backend correcto.
env:
  EXPO_PUBLIC_API_URL: https://ivan.tailc7ed08.ts.net

jobs:
  update:
    name: Publicar OTA update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas update
        run: eas update --channel preview --message "${{ github.ref_name }}" --non-interactive

  build:
    name: Compilar APK y crear Release
    # Solo cuando el tag empieza con "build-"
    if: startsWith(github.ref_name, 'build-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Fijar version desde el tag
        # build-v1.1.0 -> app.json expo.version = "1.1.0".
        # La app instalada compara esta version contra la del backend.
        run: |
          VERSION="${GITHUB_REF_NAME#build-v}"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.version='$VERSION';fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "app.json version -> $VERSION"
      - name: eas build (APK)
        run: eas build --platform android --profile preview --non-interactive --wait --json | tee build.json
      - name: Descargar APK
        run: |
          APK_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' build.json)
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "Descargando $APK_URL"
          curl -L -o "vitae-${{ github.ref_name }}.apk" "$APK_URL"
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "vitae-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --notes "Instala este APK en tu Android. Los siguientes cambios de JS/UI llegaran solos por OTA al reabrir la app."
      - name: Avisar al backend (auto-update in-app)
        # Registra la nueva version para que GET /api/v1/app/latest la devuelva.
        # apk_url = URL del artefacto en el CDN de EAS (descargable por el celular).
        # Configura los secrets BACKEND_URL y BACKEND_DEPLOY_TOKEN en el repo.
        # Si no estan, este paso se salta sin romper el release.
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_DEPLOY_TOKEN: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL no configurado — se omite el aviso al backend."
            exit 0
          fi
          curl -fsS -X POST "$BACKEND_URL/api/v1/app/releases" \
            -H "Authorization: Bearer $BACKEND_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"platform\":\"android\",\"version\":\"$VERSION\",\"apk_url\":\"$APK_URL\"}"
